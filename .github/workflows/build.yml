name: build test

on:
  push:
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: shell format and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # shfmt reads the indent settings from .editorconfig
      - name: check formatting with shfmt
        run: |
          curl -sSfL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
          chmod +x /tmp/shfmt
          /tmp/shfmt -d build-ffmpeg web-install.sh web-install-gpl-and-non-free.sh

      # The runner image ships its own shellcheck, but its version moves without
      # notice - pin one so a new release cannot turn a green branch red.
      # The scripts are clean at --severity=style, the strictest of the four
      # levels, so anything ShellCheck reports here is a regression.
      - name: shellcheck
        run: |
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz |
            tar -xJf - -C /tmp --strip-components=1 shellcheck-v0.11.0/shellcheck
          /tmp/shellcheck --version
          /tmp/shellcheck --severity=style --color=always build-ffmpeg web-install.sh web-install-gpl-and-non-free.sh

  build-linux:
    name: build in native linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: install libva-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev

      - name: build ffmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes SKIPRAV1E=yes ./build-ffmpeg --build --enable-gpl-and-non-free
          kill %1
      - name: check shared library
        run: |
          ldd ./workspace/bin/ffmpeg
      - name: test run ffmepg
        run: |
          ./workspace/bin/ffmpeg -buildconf
      - name: clean up
        run: |
          ./build-ffmpeg --cleanup

  build-macos:
    name: build in native macOS
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The runner image ships aws/tap, which Homebrew now flags as untrusted
      # and warns about on every invocation. We do not use it, so remove it.
      - name: remove untrusted homebrew taps
        run: |
          brew untap aws/tap || true

      - name: build ffmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes ./build-ffmpeg --build
          kill %1
      - name: check shared library
        run: |
          otool -L ./workspace/bin/ffmpeg
      - name: test run ffmepg
        run: |
          ./workspace/bin/ffmpeg -buildconf
      - name: clean up
        run: |
          ./build-ffmpeg --cleanup

  build-docker:
    name: build in docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: pull base image
        id: ubuntu_pull
        run: |
          docker pull ubuntu:26.04
      - name: run if ubuntu_pull failed
        if: failure() && steps.ubuntu_pull.outcome == 'failure'
        run: |
          docker pull ubuntu:26.04
      - name: build ffmpeg
        run: |
          docker build -t ffmpeg:ubuntu -f Dockerfile .
      - name: test run ffmepg
        run: |
          docker run --rm ffmpeg:ubuntu -buildconf

  build-cuda-ubuntu-docker:
    name: build in ubuntu docker with cuda
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space
        run: |
          rm -rf /usr/share/dotnet && rm -rf /opt/ghc && rm -rf "/usr/local/share/boost"
          rm -rf /opt/hostedtoolcache && cd /opt && find . -maxdepth 1 -mindepth 1 '!' -path ./containerd '!' -path ./actionarchivecache '!' -path ./runner '!' -path ./runner-cache -exec rm -rf '{}' ';'
          docker system prune -af
      - name: Checkout code
        uses: actions/checkout@v5
      - name: pull base image
        id: cuda_ubuntu_pull
        run: |
          docker pull nvidia/cuda:13.3.1-devel-ubuntu26.04
          docker pull ubuntu:26.04
      - name: run if cuda_ubuntu_pull failed
        if: failure() && steps.cuda_ubuntu_pull.outcome == 'failure'
        run: |
          docker pull nvidia/cuda:13.3.1-devel-ubuntu26.04
          docker pull ubuntu:26.04
      - name: build ffmpeg
        run: |
          docker build -t ffmpeg:cuda-ubuntu -f cuda-ubuntu.dockerfile .
      - name: test run ffmepg
        run: |
          docker run --rm ffmpeg:cuda-ubuntu -buildconf

  build-full-static:
    name: full static build in docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # full-static.dockerfile builds FROM ubuntu:26.04, not from a cuda image
      - name: pull base image
        id: ubuntu_pull
        run: |
          docker pull ubuntu:26.04
      - name: run if ubuntu_pull failed
        if: failure() && steps.ubuntu_pull.outcome == 'failure'
        run: |
          docker pull ubuntu:26.04
      - name: build ffmpeg
        run: |
          docker build -t ffmpeg:cuda-static -f full-static.dockerfile .
      - name: test run ffmepg
        run: |
          docker run --rm ffmpeg:cuda-static -buildconf

  # Publishes the install tarball. The `on:` block above is deliberately left
  # alone: a tag push is already a push event (and path filters do not apply to
  # tags), so lint and all five builds run for the tag as-is. Adding a `tags:`
  # filter there would stop branch pushes from triggering anything at all.
  # Instead this job filters itself with `if:` and gates on the other six.
  release:
    name: publish release tarball
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ lint, build-linux, build-macos, build-docker, build-cuda-ubuntu-docker, build-full-static ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 so refs/tags/<TAG> exists locally for `git archive`.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Guards the one mistake that hurts: tagging v1.63 on a commit whose
      # build-ffmpeg still says 1.62. Checked against the tagged commit only,
      # so master carrying the next release's version stays legal. The tag has
      # a v prefix, SCRIPT_VERSION does not.
      - name: check the tag matches SCRIPT_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^SCRIPT_VERSION=//p' build-ffmpeg | head -n 1)
          echo "tag=$TAG SCRIPT_VERSION=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match SCRIPT_VERSION=$version in build-ffmpeg; expected tag v$version"
            exit 1
          fi

      # The asset names must never contain the version:
      # releases/latest/download/<asset> only resolves for a filename that is
      # identical across releases. .gitattributes export-ignore keeps the
      # archive to what a build actually needs.
      - name: build the tarball and its checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --prefix=ffmpeg-build-script/ -o ffmpeg-build-script.tar.gz "$TAG"
          # A bare filename here, so the .sha256 records a bare filename and
          # `sha256sum -c` works from whatever directory the installer
          # downloaded the pair into.
          sha256sum ffmpeg-build-script.tar.gz >ffmpeg-build-script.tar.gz.sha256
          cat ffmpeg-build-script.tar.gz.sha256
          sha256sum -c ffmpeg-build-script.tar.gz.sha256
          tar -tzf ffmpeg-build-script.tar.gz

      # The release itself must already exist for this tag - publishing it from
      # the GitHub UI creates the tag, which is what starts this workflow. A
      # tag pushed from the command line with no release behind it fails here
      # with "release not found"; publish the release and re-run the job.
      #
      # --clobber so re-running the workflow on an existing release replaces
      # the assets instead of failing on "already exists".
      - name: upload the assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            ffmpeg-build-script.tar.gz \
            ffmpeg-build-script.tar.gz.sha256 \
            --clobber
